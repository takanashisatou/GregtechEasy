plugins {
    id 'java'
    id 'idea'
    alias libs.plugins.modDevGradle
}

evaluationDependsOn(':modules:gtm-reborn')
evaluationDependsOn(':modules:gt--')
evaluationDependsOn(':modules:gtecore')


group = 'org.satou.gtecore'
version = '1.0.0-DEV-RUNTIME'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

obfuscation {
    createRemappingConfiguration(configurations.localRuntime)
}

dependencies {
    implementation(project(':modules:gtm-reborn')) { transitive = false }
    implementation(project(':modules:gt--')) { transitive = false }
    implementation(project(':modules:gtecore')) { transitive = false }

    modLocalRuntime("blank:gtmthings:1.5.4")
    modLocalRuntime(forge.ldlib)
    modLocalRuntime(forge.registrate)
    modLocalRuntime(forge.configuration)
    // gtm-reborn's dev jar no longer embeds mixinextras (SRG jarJar embeds
    // broke named dev runs), so provide the named copy explicitly.
    // Pin 0.5.5: gtm-reborn resolves mixinextras via a `[0.5.0-rc.3,)` require
    // range, i.e. 0.5.5, so dev runs must load the same API level.
    modLocalRuntime("io.github.llamalad7:mixinextras-forge:0.5.5")
    modLocalRuntime(forge.ae2)
    modLocalRuntime(forge.guideme)
    modLocalRuntime(forge.bundles.jei)
    modLocalRuntime(forge.jade)
    modLocalRuntime(forge.curios)
    modLocalRuntime(forge.architectury)
    modLocalRuntime(forge.kubejs)
    modLocalRuntime(forge.rhino)
    modLocalRuntime(forge.kotlinforforge)
    modLocalRuntime(forge.ponder)
    modLocalRuntime(forge.flywheel.forge)

    // Full-pack mods: scan the packwiz overrides (gte/overrides/mods is the
    // exact jar set of the production "Oh" instance) first, then the legacy
    // bundled libs dir for extras, so the dev client loads the same mod set
    // as the shipped pack. Every jar goes through modLocalRuntime, which
    // remaps it SRG -> named for the dev runtime.
    def packModsDir = file("${rootDir}/gte/overrides/mods")
    def legacyLibsDir = file("${rootDir}/modules/gtecore/gradle/libs")
    def alreadyProvided = [
        // provided above via maven modLocalRuntime coordinates
        'appliedenergistics2-forge', 'architectury-', 'curios-forge',
        'gtmthings', 'guideme', 'jade-', 'jei-1.20.1-forge',
        'kotlinforforge', 'kubejs-forge', 'rhino-forge',
        'ldlib', 'configuration-'
    ]
    def devUnsafe = [
        // replaced by sourceSet-backed mods{} mappings
        'gtm-reborn', 'gtecore', 'gtnn-', 'gt---',
        // production shader/optimizer jars break deobfuscated dev runs
        'oculus', 'embeddium', 'modernfix', 'modern-ui', 'modernui'
    ]
    def seen = [] as Set
    [packModsDir, legacyLibsDir].each { dir ->
        if (!dir.exists()) {
            return
        }
        dir.eachFileMatch(~/.*\.jar/) { jar ->
            if (!seen.add(jar.name)) {
                return
            }
            def name = jar.name.toLowerCase()
            if (alreadyProvided.any { name.contains(it) }) {
                return
            }
            if (devUnsafe.any { name.contains(it) }) {
                return
            }

            def base = jar.name.replaceAll(/\.jar$/, '')
            def parts = base.split('-')
            def versionStart = -1
            for (int i = parts.length - 1; i >= 0; i--) {
                if (parts[i] ==~ /^\d.*/) {
                    versionStart = i
                    break
                }
            }
            if (versionStart < 0) {
                versionStart = parts.length - 1
            }
            def artifact = parts[0..<versionStart].join('-')
            def version = parts[versionStart..-1].join('-')
            modLocalRuntime("dev:${artifact}:${version}")
        }
    }
}

repositories {
    // The shared repositories.gradle only points flatDir at the legacy libs
    // dir; the full-pack scan above also needs the packwiz overrides.
    flatDir { dir "${rootDir}/gte/overrides/mods" }
}

legacyForge {
    version = libs.versions.minecraftForge.get()
    parchment {
        minecraftVersion = libs.versions.minecraft.get()
        mappingsVersion = libs.versions.parchment.get()
    }

    mods {
        gtceu {
            sourceSet(project(':modules:gtm-reborn').sourceSets.main)
            sourceSet(project(':modules:gtm-reborn').sourceSets.client)
            sourceSet(project(':modules:gtm-reborn').sourceSets.extra)
        }
        gtnn {
            sourceSet(project(':modules:gt--').sourceSets.main)
        }
        gtecore {
            sourceSet(project(':modules:gtecore').sourceSets.main)
            sourceSet(project(':modules:gtecore').sourceSets.client)
        }
    }

    runs {
        client {
            client()
            ideName = "Run GTE Full Pack (Client - Hot Debug)"
            gameDirectory.set(file("${rootDir}/run/client"))
            systemProperty('forge.logging.markers', 'REGISTRIES')
            systemProperty('forge.logging.console.level', 'info')
            def runtimeXmx = System.getenv('GTE_RUNTIME_XMX') ?: '8G'
            jvmArguments.addAll("-Xmx${runtimeXmx}", '-XX:+UseG1GC')
        }

        server {
            server()
            ideName = "Run GTE Full Pack (Server - Hot Debug)"
            gameDirectory.set(file("${rootDir}/run/server"))
            programArguments.addAll('--nogui')
            jvmArguments.addAll('-Xmx6G', '-XX:+UseG1GC')
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'mixin.config', 'gtceu.mixins.json,gtecore.mixins.json,gtnn.mixins.json'
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}

// Disable maven publishing and archive production for this shadow dev module
tasks.withType(Jar).configureEach {
    enabled = false
}
tasks.withType(PublishToMavenRepository).configureEach {
    enabled = false
}
