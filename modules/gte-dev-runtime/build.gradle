plugins {
    id 'java'
    id 'idea'
    alias libs.plugins.modDevGradle
}

evaluationDependsOn(':modules:gtm-reborn')
evaluationDependsOn(':modules:gt--')
evaluationDependsOn(':modules:gtecore')


group = 'org.satou.gtecore'
version = '1.0.0-DEV-RUNTIME'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

obfuscation {
    createRemappingConfiguration(configurations.localRuntime)
}

// ---------------------------------------------------------------------------
// Full-pack mods for the dev runtime: coordinates, never flat files
// ---------------------------------------------------------------------------
// The dev client loads the same mod set as the shipped pack, but it runs with
// named (Mojang) mappings, and ModDevGradle only remaps SRG -> named for
// *coordinate* dependencies - a jar it resolves from a flatDir repository is
// handed to the run untouched. Feeding the pack's production jars to the run
// that way is how the 2026-09-01 incident started: the run failed on the first
// vanilla @Shadow, and the "fix" (commit 9a67970) copied the dev runtime's named
// output back over gte/overrides/mods - 94 dev jars under the published file
// names, and every nightly afterwards died before the main menu.
//
// So publish the pack's jars as gte.mods:<artifact>:<version> into a generated
// local Maven repository. ModDevGradle then remaps them for the dev runtime, the
// pack keeps its published (SRG) bytes, and every dev-only copy stays under
// build/ where it cannot be committed by accident.
def packModsDir = file("${rootDir}/gte/overrides/mods")
def devModsRepoDir = file("${rootDir}/build/localMaven")
def packModsAlreadyProvided = [
    // provided above via maven modLocalRuntime coordinates
    'appliedenergistics2', 'architectury', 'curios',
    'gtmthings', 'guideme', 'jade', 'jei',
    'kotlinforforge', 'kubejs', 'rhino',
    'ldlib', 'configuration', 'ponder', 'flywheel',
    'patchouli', 'botania', 'theoneprobe', 'cloth-config',
    'ftb-library', 'ftb-teams', 'ftb-quests', 'ftb-chunks',
    'ftb-ultimine', 'ftb-essentials', 'resourceful',
    'sophisticatedcore', 'sophisticatedbackpacks', 'sophisticatedstorage',
    'extendedae', 'ae2wtlib', 'ferritecore', 'glodium', 'item-filters',
    'embeddium', 'oculus'
]
def packModsDevUnsafe = [
    // replaced by sourceSet-backed mods{} mappings
    'gtm-reborn', 'gtecore', 'gtnn-', 'gt---'
]

/** [artifact, mavenVersion] for a pack jar name, or null when it does not parse. */
def packModCoordinate = { String fileName ->
    def base = fileName.replaceAll(/\.jar$/, '')
    // Pack file names use either '-' or '_' as the separator (fancymenu ships as
    // fancymenu_forge_3.8.1_MC_1.20.1.jar). The version starts at the first
    // numeric segment after the first one, so "AdvancedAE-1.1.4-1.20.1" becomes
    // AdvancedAE:1.1.4-1.20.1 rather than AdvancedAE-1.1.4:1.20.1.
    def separator = base.contains('-') ? '-' : '_'
    def parts = base.split(separator == '-' ? '-' : '_')
    def versionStart = -1
    for (int i = 1; i < parts.length; i++) {
        if (parts[i] ==~ /^\d.*/) {
            versionStart = i
            break
        }
    }
    if (versionStart <= 0) {
        return null
    }
    // Gradle rejects coordinates outside [A-Za-z0-9_.-] and a '+' cannot appear
    // in a Maven version, so sanitise both halves here; the publisher writes the
    // repository layout with exactly these values.
    def sanitise = { String value -> value.replace('+', '_').replaceAll(/[^A-Za-z0-9_.\-]/, '_') }
    return [sanitise(parts[0..<versionStart].join(separator)), sanitise(parts[versionStart..-1].join(separator))]
}

def publishPackModsForDev = tasks.register('publishPackModsForDev') {
    group = 'gte'
    description = 'Publishes the shipped pack jars as gte.mods coordinates so ModDevGradle remaps them for the dev runtime.'
    inputs.files(fileTree(packModsDir) { include '*.jar' }).withPropertyName('packJars').optional()
    outputs.dir(devModsRepoDir).withPropertyName('devModsRepo')
    doLast {
        devModsRepoDir.mkdirs()
        def published = 0
        def jars = (packModsDir.listFiles({ File f -> f.name.toLowerCase().endsWith('.jar') } as FileFilter) ?: new File[0]).sort { it.name }
        jars.each { jar ->
            def lower = jar.name.toLowerCase()
            if (packModsAlreadyProvided.any { lower.contains(it) } || packModsDevUnsafe.any { lower.contains(it) }) {
                return
            }
            def coord = packModCoordinate(jar.name)
            if (coord == null) {
                logger.warn(">> ${jar.name} does not parse into gte.mods coordinates; the dev runtime will not load it.")
                return
            }
            def artifact = coord[0]
            def mavenVersion = coord[1]
            def target = new File(devModsRepoDir, "gte/mods/${artifact}/${mavenVersion}")
            target.mkdirs()
            def jarTarget = new File(target, "${artifact}-${mavenVersion}.jar")
            // Always overwrite: a stale copy with the same length would silently
            // keep the old bytes, and that is exactly how the pack got poisoned.
            jarTarget.bytes = jar.bytes
            new File(target, "${artifact}-${mavenVersion}.pom").text = """<?xml version="1.0" encoding="UTF-8"?>
<project xmlns="http://maven.apache.org/POM/4.0.0"
         xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
         xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
    <modelVersion>4.0.0</modelVersion>
    <groupId>gte.mods</groupId>
    <artifactId>${artifact}</artifactId>
    <version>${mavenVersion}</version>
</project>
"""
            published++
        }
        logger.lifecycle(">> Published ${published} pack mod(s) into ${devModsRepoDir} as gte.mods coordinates for the dev runtime.")
    }
}

dependencies {
    implementation(project(':modules:gtm-reborn')) { transitive = false }
    implementation(project(':modules:gt--')) { transitive = false }
    implementation(project(':modules:gtecore')) { transitive = false }

    modLocalRuntime("blank:gtmthings:1.5.4")
    modLocalRuntime(forge.ldlib)
    modLocalRuntime(forge.registrate)
    modLocalRuntime(forge.configuration)
    // gtm-reborn's dev jar no longer embeds mixinextras (SRG jarJar embeds
    // broke named dev runs), so provide the named copy explicitly.
    // Pin 0.5.5: gtm-reborn resolves mixinextras via a `[0.5.0-rc.3,)` require
    // range, i.e. 0.5.5, so dev runs must load the same API level.
    modLocalRuntime("io.github.llamalad7:mixinextras-forge:0.5.5")
    modLocalRuntime(forge.ae2)
    modLocalRuntime(forge.guideme)
    modLocalRuntime(forge.bundles.jei)
    modLocalRuntime(forge.jade)
    modLocalRuntime(forge.curios)
    modLocalRuntime(forge.architectury)
    modLocalRuntime(forge.kubejs)
    modLocalRuntime(forge.rhino)
    modLocalRuntime(forge.kotlinforforge)
    modLocalRuntime(forge.ponder)
    modLocalRuntime(forge.flywheel.forge)
    modLocalRuntime(forge.patchouli)
    modLocalRuntime(forge.botania)
    modLocalRuntime(forge.theoneprobe)
    modLocalRuntime(forge.clothconfig)
    modLocalRuntime(forge.ftblibrary)
    modLocalRuntime(forge.ftbteams)
    modLocalRuntime(forge.ftbquests)
    modLocalRuntime(forge.ftbchunks)
    modLocalRuntime(forge.ftbultimine)
    modLocalRuntime(forge.ftbessentials)
    modLocalRuntime(forge.resourcefullib)
    modLocalRuntime(forge.sophisticatedcore)
    modLocalRuntime(forge.sophisticatedbackpacks)
    modLocalRuntime(forge.sophisticatedstorage)
    modLocalRuntime(forge.embeddium)
    modLocalRuntime(forge.oculus)
    modLocalRuntime(forge.extendedae)
    modLocalRuntime(forge.ae2wtlib)
    modLocalRuntime(forge.ferritecore)
    modLocalRuntime(forge.glodium)
    modLocalRuntime("dev.latvian.mods:item-filters-forge:2001.1.0-build.59")

    // Full-pack mods: the exact jar set of the shipped pack, resolved from the
    // generated local Maven repository as gte.mods coordinates so ModDevGradle
    // remaps them SRG -> named (see publishPackModsForDev above).
    def seen = [] as Set
    [packModsDir].each { dir ->
        if (!dir.exists()) {
            return
        }
        dir.eachFileMatch(~/.*\.jar/) { jar ->
            if (!seen.add(jar.name)) {
                return
            }
            def name = jar.name.toLowerCase()
            if (packModsAlreadyProvided.any { name.contains(it) }) {
                return
            }
            if (packModsDevUnsafe.any { name.contains(it) }) {
                return
            }

            def coord = packModCoordinate(jar.name)
            if (coord != null) {
                modLocalRuntime("gte.mods:${coord[0]}:${coord[1]}")
            } else {
                // NEVER fall back to a version-less dependency: Gradle answers
                // "any version" by enumerating versions from every declared
                // repository, which hangs the run on an unreachable mirror
                // instead of failing (that is what stalled the 2026-09-23 run).
                logger.warn(">> ${jar.name} does not parse into gte.mods coordinates; the dev runtime will not load it.")
            }
        }
    }
}

repositories {
    // The generated gte.mods repository publishPackModsForDev writes into. This
    // is what lets ModDevGradle remap the pack's production jars for the dev
    // runtime; the flatDir entry stays only for anything resolved by bare name.
    maven {
        name = 'GteDevPackMods'
        url = uri(devModsRepoDir)
        content { includeGroup 'gte.mods' }
    }
    flatDir {
        dirs "${rootDir}/gte/overrides/mods"
    }
}

// The generated group exists ONLY in that directory, so tell every other
// repository to ignore it. Without this Gradle probes all ~25 declared
// repositories (taberna, repsy, tterrag, FTB, Modrinth, ... plus a few
// unreachable mirrors) for each of the ~70 generated coordinates before it
// reaches the local one: ~1700 HTTP requests, each waiting on a timeout, which
// looks exactly like a hung run.
repositories.configureEach { repo ->
    if (repo.name != 'GteDevPackMods' && repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository) {
        repo.content { excludeGroup 'gte.mods' }
    }
}

legacyForge {
    version = libs.versions.minecraftForge.get()
    parchment {
        minecraftVersion = libs.versions.minecraft.get()
        mappingsVersion = libs.versions.parchment.get()
    }

    mods {
        gtceu {
            sourceSet(project(':modules:gtm-reborn').sourceSets.main)
            sourceSet(project(':modules:gtm-reborn').sourceSets.client)
            sourceSet(project(':modules:gtm-reborn').sourceSets.extra)
        }
        gtnn {
            sourceSet(project(':modules:gt--').sourceSets.main)
        }
        gtecore {
            sourceSet(project(':modules:gtecore').sourceSets.main)
            sourceSet(project(':modules:gtecore').sourceSets.client)
        }
    }

    runs {
        client {
            client()
            ideName = "Run GTE Full Pack (Client - Hot Debug)"
            gameDirectory.set(file("${rootDir}/run/client"))
            // Minecraft's 854x480 default is a speck on a high-DPI screen, which is
            // half of why the run looked like it never opened a window. GLFW sizes
            // in physical pixels on Windows, so keep the default modest enough to
            // fit a 1920x1080 desktop; override per machine with GTE_WINDOW_WIDTH /
            // GTE_WINDOW_HEIGHT.
            programArguments.addAll(
                '--width', (System.getenv('GTE_WINDOW_WIDTH') ?: '1600'),
                '--height', (System.getenv('GTE_WINDOW_HEIGHT') ?: '900')
            )
            systemProperty('forge.logging.markers', 'REGISTRIES')
            systemProperty('forge.logging.console.level', 'info')
            systemProperty('embeddium.allow_broken_mods', 'true')
            systemProperty('flywheel.backend', 'off')
            systemProperty('flw.backend', 'off')
            systemProperty('fml.earlyprogresswindow', 'false')
            systemProperty('forge.earlyWindow', 'false')
            def runtimeXmx = System.getenv('GTE_RUNTIME_XMX') ?: '8G'
            jvmArguments.addAll(
                "-Xmx${runtimeXmx}",
                '-XX:+UseG1GC',
                '-da:snownee.jade...',
                '-Dfml.earlyprogresswindow=false',
                '-Dforge.earlyWindow=false',
                '-Dembeddium.allow_broken_mods=true',
                '-Dflywheel.backend=off',
                '-Dflw.backend=off',
                '-Dfile.encoding=UTF-8',
                '-Dsun.stdout.encoding=UTF-8',
                '-Dsun.stderr.encoding=UTF-8'
            )
        }

        server {
            server()
            ideName = "Run GTE Full Pack (Server - Hot Debug)"
            gameDirectory.set(file("${rootDir}/run/server"))
            programArguments.addAll('--nogui')
            jvmArguments.addAll('-Xmx6G', '-XX:+UseG1GC')
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            programArguments.addAll('--mixin', 'gtceu.mixins.json', '--mixin', 'gtecore.mixins.json', '--mixin', 'gtnn.mixins.json')
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}

// Automatically establish real-time two-way directory junctions/symlinks between gte/overrides and run/client
tasks.register('linkDevEnvironment') {
    doLast {
        def isWin = org.gradle.internal.os.OperatingSystem.current().isWindows()
        def targets = [
            'kubejs',
            'config/ftbquests',
            'defaultconfigs',
            'tlm_custom_pack',
            'patchouli_books'
        ]
        targets.each { rel ->
            def targetDir = file("${rootDir}/gte/overrides/${rel}")
            def linkDir = file("${rootDir}/run/client/${rel}")
            if (!targetDir.exists()) {
                targetDir.mkdirs()
            }
            if (!linkDir.exists()) {
                linkDir.parentFile.mkdirs()
                if (isWin) {
                    exec {
                        commandLine 'cmd', '/c', 'mklink', '/J', linkDir.absolutePath, targetDir.absolutePath
                    }
                } else {
                    java.nio.file.Files.createSymbolicLink(linkDir.toPath(), targetDir.toPath())
                }
                println "[GTE] Linked ${rel} -> ${targetDir.absolutePath}"
            }
        }
    }
}

tasks.matching { it.name in ['runClient', 'prepareClientRun'] }.configureEach {
    dependsOn(tasks.named('linkDevEnvironment'))
    dependsOn(publishPackModsForDev)
}

// The pack mods must exist in the generated repository before anything resolves
// the dev runtime classpath, whatever MDG names its own preparation tasks.
tasks.matching { it.name.startsWith('prepare') || it.name in ['runClient', 'runServer'] }.configureEach {
    dependsOn(publishPackModsForDev)
}

// ---------------------------------------------------------------------------
// Pull the game window to the front once it appears (Windows only)
// ---------------------------------------------------------------------------
// The early progress window MUST stay disabled here: with Embeddium/Oculus in
// modLocalRuntime, `fmlearlywindow` builds a second GLFW/OpenGL context on a
// worker thread and deadlocks the render thread on NVIDIA GPUs (SKILL.md Case 7).
// The cost is that GLFW only creates the window inside Minecraft.<init>, ~25 s
// into the run. By then the JVM is a background process forked by the Gradle
// daemon, so Windows refuses its SetForegroundWindow call and the window is
// stacked *behind* whatever the user clicked in the meantime - it is created and
// rendering, just completely covered. That is the "runFullPack never opens a
// window" report. Re-raising it from outside the JVM works because SetWindowPos
// Z-order changes are not subject to the foreground lock.
def raiseWindowScript = file("${rootDir}/scripts/dev/raise_game_window.ps1")
def raiseWindowLog = layout.buildDirectory.file('raise-game-window.log').get().asFile
def isWindowsHost = org.gradle.internal.os.OperatingSystem.current().isWindows()

tasks.matching { it.name == 'runClient' }.configureEach {
    doFirst {
        if (!isWindowsHost) {
            return
        }
        if (System.getenv('GTE_NO_WINDOW_RAISE')) {
            logger.lifecycle('>> GTE_NO_WINDOW_RAISE is set - leaving the game window where GLFW puts it.')
            return
        }
        if (!raiseWindowScript.exists()) {
            logger.warn(">> ${raiseWindowScript} is missing - the game window will not be raised.")
            return
        }
        raiseWindowLog.parentFile.mkdirs()
        // Fire and forget: the helper polls for the window, raises it once and exits.
        // ProcessBuilder (not exec {}) so the build does not wait for it.
        new ProcessBuilder(
            'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass',
            '-File', raiseWindowScript.absolutePath,
            '-TimeoutSeconds', '600'
        ).redirectErrorStream(true).redirectOutput(raiseWindowLog).start()
        logger.lifecycle(">> Game window will be raised when it appears (log: ${raiseWindowLog}, disable with GTE_NO_WINDOW_RAISE=1)")
    }
}

// Disable maven publishing and archive production for this shadow dev module
tasks.withType(Jar).configureEach {
    enabled = false
}
tasks.withType(PublishToMavenRepository).configureEach {
    enabled = false
}
