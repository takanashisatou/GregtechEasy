org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=2G -XX:+UseG1GC
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=4
org.gradle.vfs.watch=false
kotlin.daemon.jvmargs=-Xmx2G
org.gradle.java.installations.auto-download=false
# ModDevGradle's own tooling (createMinecraftArtifacts -> 'toolsJavaExecutable') runs on a
# Java 17 toolchain while the mods compile on Java 21. Gradle auto-detection cannot see JDKs
# installed by actions/setup-java on the self-hosted runner (the service runs as LocalSystem
# and per-user .jdks folders are invisible), so also resolve toolchains from the
# JAVA_HOME_<version>_<arch> variables setup-java exports.
org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_17_ARM64,JAVA_HOME_21_ARM64


# Network optimizations
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.http.keepAlive=true
systemProp.https.protocols=TLSv1.2,TLSv1.3

# Root project properties
# Keep in sync with gradle/libs.versions.toml and gte/pack.toml. gtmthings 1.5.4
# requires forge "[47.4.1,)", and appliedenergistics2 15.4.9's mixins stop
# resolving on 47.4.10, so 47.4.1 is the one version that satisfies both.
minecraft_version=1.20.1
forge_version=47.4.1

# Strict compiler warning toggle: set to true to enforce -Werror locally
werror=false
