site_name: GregTech Easy (GTE) 文档
site_description: GregTech Easy (GTE-Multi) 官方人类可读多语言开发与游玩指南文档
site_author: takanashisatou & GTE Team
site_url: https://takanashisatou.github.io/

repo_name: takanashisatou/GregtechEasy
repo_url: https://github.com/takanashisatou/GregtechEasy
edit_uri: blob/main/docs/

docs_dir: docs

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  language: zh
  palette:
    # 浅色模式 / Light Scheme
    - scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: 切换至深色模式 / Switch to Dark Mode
    # 深色模式 / Dark Scheme
    - scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: 切换至浅色模式 / Switch to Light Mode
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.view
    - content.action.edit

plugins:
  - search
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      languages:
        - locale: zh
          name: 简体中文
          build: true
          default: true
          site_name: GregTech Easy (GTE) 官方文档
