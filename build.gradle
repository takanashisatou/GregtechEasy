buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'org.jetbrains.kotlin.jvm' version '2.0.21' apply false
}

allprojects {
    group = 'org.satou.gtecore'
    
    def wprop = project.findProperty('werror')
    boolean enableWerror = (wprop == 'true' || wprop == '' || (project.hasProperty('werror') && wprop == null)) || 
                           System.getenv('WERROR') == 'true' ||
                           (System.getenv("GITHUB_REF_TYPE") == "tag" && System.getenv("GITHUB_REF_NAME")?.startsWith("v") && !System.getenv("GITHUB_REF_NAME")?.contains("alpha") && !System.getenv("GITHUB_REF_NAME")?.contains("beta"))

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'

        if (enableWerror) {
            options.compilerArgs << "-Werror"
        }

        options.compilerArgs << "-Aquiet=true"
    }

    plugins.withId('org.jetbrains.kotlin.jvm') {
        tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            compilerOptions {
                allWarningsAsErrors.set(enableWerror)
            }
        }
    }
}

subprojects {
    apply plugin: 'java'
    apply from: "${rootDir}/gradle/scripts/repositories.gradle"

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
    }
}

// ---------------------------------------------------------------------------
// IDEA indexing load control
// ---------------------------------------------------------------------------
// The aggregate checkout carries hundreds of MB of runtime logs, world saves
// and packed mod jars that must never be indexed (indexing them ran the IDE
// out of heap: OutOfMemoryError in FileBasedIndex / Trigram.Index). Gradle
// sync honors idea.module.excludeDirs from the tooling model, so declare the
// exclusions in the build. build/ and .gradle/ dirs are excluded
// automatically by the Gradle integration.
idea {
    module {
        // run/               : dev-runtime game dirs (multi-MB debug.log, saves)
        // gte/overrides/mods : ~263 MB of binary mod jars, no editing value
        excludeDirs += files('run', 'gte/overrides/mods')
    }
}

subprojects {
    plugins.withId('idea') {
        idea {
            module {
                // per-module run/ dirs (runData / runClient outputs and logs)
                excludeDirs += files('run')
            }
        }
    }
}

// ---------------------------------------------------------------------------
// Blockbench Art Assets Synchronization Task
// ---------------------------------------------------------------------------
// ---------------------------------------------------------------------------
// Blockbench Art Assets Synchronization Task
// ---------------------------------------------------------------------------
tasks.register('syncBlockbenchAssets') {
    group = 'build'
    description = 'Multi-namespace synchronization of 3D models and textures from art_assets/'

    def artAssetsDir = file("${rootDir}/art_assets")
    inputs.dir(artAssetsDir)

    doLast {
        if (!artAssetsDir.exists()) {
            logger.warn("art_assets directory does not exist, skipping asset synchronization.")
            return
        }

        exec {
            commandLine 'python', "${rootDir}/scripts/sync_art_assets.py"
            ignoreExitValue = true
        }
    }
}

subprojects {
    tasks.matching { it.name == 'processResources' }.configureEach {
        dependsOn rootProject.tasks.named('syncBlockbenchAssets')
    }
}

// ---------------------------------------------------------------------------
// Aggregated Lifecycle Tasks
// ---------------------------------------------------------------------------
tasks.register('buildAll') {
    group = 'build'
    description = 'Build all submodules in order (gtm-reborn -> gt-- -> gtecore)'
    dependsOn ':modules:gtm-reborn:build'
    dependsOn ':modules:gt--:build'
    dependsOn ':modules:gtecore:build'
}

tasks.register('copyOutputJars') {
    group = 'build'
    description = 'Copy built core jars to gte/overrides/mods/'
    dependsOn 'buildAll'

    doLast {
        def overridesModsDir = file("${rootDir}/gte/overrides/mods")
        overridesModsDir.mkdirs()

        copy {
            from project(':modules:gtm-reborn').layout.buildDirectory.dir('libs')
            from project(':modules:gt--').layout.buildDirectory.dir('libs')
            from project(':modules:gtecore').layout.buildDirectory.dir('libs')
            include '*.jar'
            // -slim / -dev-slim are deliberately built WITHOUT their jar-in-jar
            // dependencies (ldlib, configuration, Registrate, flywheel, ...).
            // They exist for Maven consumers, not for a runnable pack. Shipping
            // them into mods/ makes Forge see three files declaring modId
            // "gtceu" / "gtecore", pick a slim one, and then abort with
            //   Missing or unsupported mandatory dependencies:
            //     Mod ID: 'ldlib', Requested by: 'gtceu' ... [MISSING]
            // Only the fat jars belong in a playable pack.
            exclude '*-sources.jar', '*-dev.jar', '*-all.jar', '*-slim.jar', '*-dev-slim.jar'
            into overridesModsDir
        }
        logger.lifecycle(">> Successfully copied latest mod jars and runtime libs to ${overridesModsDir.absolutePath}")
    }
}

tasks.register('publishAllToMaven') {
    group = 'publishing'
    description = 'Publish all submodules to local build/maven directory (for GitHub Pages deploy)'
    dependsOn ':modules:gt--:publish'
    dependsOn ':modules:gtecore:publish'
    dependsOn ':modules:gtm-reborn:publish'
}

tasks.register('publishAllToMavenLocal') {
    group = 'publishing'
    description = 'Publish all submodules to user local ~/.m2/repository/'
    dependsOn ':modules:gt--:publishToMavenLocal'
    dependsOn ':modules:gtecore:publishToMavenLocal'
    dependsOn ':modules:gtm-reborn:publishToMavenLocal'
}
