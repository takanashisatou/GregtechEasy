name: "GTE-Multi CI/CD Build & Multi-Channel Release"

on:
  push:
    branches:
      - master
      - main
      - dev
      - satou
    tags:
      - 'v*'
      - 'alpha-*'
      - 'beta-*'
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - '.github/workflows/docs-deploy.yml'
      - '.github/workflows/translate.yml'
      - '**.md'
  pull_request:
    branches:
      - master
      - main
      - dev
      - satou
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - '.github/workflows/docs-deploy.yml'
      - '.github/workflows/translate.yml'
      - '**.md'
  schedule:
    - cron: '0 2 * * *' # Daily Nightly build at 02:00 UTC
  workflow_dispatch:
    inputs:
      channel:
        description: "Release Channel"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - nightly
          - alpha
          - beta
          - release
      version:
        description: "Custom Version (e.g. 3.0.0, nightly-3.0.0)"
        required: false
        default: ""
        type: string
      werror:
        description: "Force -Werror (Warning as Error)"
        required: false
        default: false
        type: boolean
      runner:
        description: "Runner environment"
        required: false
        default: "windows-latest"
        type: choice
        options:
          - windows-latest
          - ubuntu-latest
          - self-hosted

permissions:
  contents: write
  pull-requests: write
  # Needed by "Trigger Docs Deploy Workflow": dispatching another workflow is an
  # Actions API write, and without this GITHUB_TOKEN gets
  # "HTTP 403: Resource not accessible by integration".
  actions: write

jobs:
  build-and-sync:
    name: "GTE-Multi Build, Test, Translate & Sync"
    # GitHub-hosted windows-latest by default. The self-hosted Windows runner is
    # retired: it was a single machine, so every push and every PR to main queued
    # behind whatever was already running, and its outbound link made the release
    # upload step take ~70 minutes for 335 MB of assets (measured ~0.08 MB/s).
    # It stays selectable via workflow_dispatch for local debugging only, and
    # nothing schedules it.
    #
    # windows-latest is kept rather than ubuntu-latest because every `run:` block
    # in this job is PowerShell and several shell out to cmd.exe /c gradlew.bat.
    runs-on: ${{ inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || inputs.runner == 'self-hosted' && fromJSON('["self-hosted", "Windows", "X64"]') || 'windows-latest' }}
    defaults:
      run:
        shell: powershell
    env:
      # Python on Windows encodes stdout with the ANSI code page, which is cp1252
      # on hosted runners and GBK on the (retired) self-hosted box. The pack tree
      # contains CJK paths -- e.g. config/inventoryprofilesnext/新的世界/ -- so any
      # script that prints a filename it just processed died on the hosted runner
      # with
      #   UnicodeEncodeError: 'charmap' codec can't encode characters in
      #   position 44-47: character maps to <undefined>
      # after 42 minutes of successful build work, while passing locally purely
      # because GBK happens to cover those characters. Force UTF-8 for every
      # Python step in this job.
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      # A cancelled or timed-out run leaves its single-use Gradle daemon alive. That
      # orphan keeps the file locks inside GRADLE_USER_HOME, so the NEXT run blocks
      # forever in DefaultResourceLockCoordinationService with 0% CPU and no output.
      # Hosted runners get a fresh VM and do not need this.
      - name: Reap Orphaned Gradle Daemons (self-hosted only)
        if: runner.environment == 'self-hosted'
        continue-on-error: true
        run: |
          $orphans = Get-CimInstance Win32_Process -Filter "Name='java.exe'" |
            Where-Object { $_.CommandLine -match 'GradleDaemon|GradleWrapperMain' }
          if ($orphans) {
            foreach ($p in $orphans) {
              Write-Host "Killing orphaned Gradle process $($p.ProcessId)"
              Stop-Process -Id $p.ProcessId -Force -ErrorAction SilentlyContinue
            }
            Start-Sleep -Seconds 3
          } else {
            Write-Host "No orphaned Gradle processes found."
          }
          $homes = @($env:GRADLE_USER_HOME, "$env:USERPROFILE\.gradle") | Where-Object { $_ -and (Test-Path $_) }
          foreach ($h in $homes) {
            Get-ChildItem $h -Recurse -Filter "*.lock" -ErrorAction SilentlyContinue |
              ForEach-Object { Remove-Item $_.FullName -Force -ErrorAction SilentlyContinue }
          }

      - name: Checkout Repository & Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ModDevGradle runs its own tooling (createMinecraftArtifacts ->
      # 'toolsJavaExecutable') on a Java 17 toolchain, while the mods themselves
      # compile and run on Java 21. Both must be installed, and both must be
      # reachable through org.gradle.java.installations.fromEnv (see
      # gradle.properties): the self-hosted runner service runs as LocalSystem and
      # cannot see per-user JDK directories such as %USERPROFILE%\.jdks.
      # JDK 21 is listed last so it becomes JAVA_HOME.
      - name: Set up JDK 17 + 21
        uses: actions/setup-java@v4
        continue-on-error: true
        with:
          java-version: |
            17
            21
          distribution: 'temurin'
          cache: 'gradle'

      - name: Verify Java Toolchains Are Visible to Gradle
        run: |
          Write-Host "JAVA_HOME        = $env:JAVA_HOME"
          Write-Host "JAVA_HOME_17_X64 = $env:JAVA_HOME_17_X64"
          Write-Host "JAVA_HOME_21_X64 = $env:JAVA_HOME_21_X64"
          if (-not $env:JAVA_HOME_17_X64) {
            Write-Host "::error::JDK 17 toolchain missing - ModDevGradle createMinecraftArtifacts will fail."
            exit 1
          }
          if (-not $env:JAVA_HOME_21_X64) {
            Write-Host "::error::JDK 21 toolchain missing - module compilation will fail."
            exit 1
          }

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      # ──────────────────────────────────────────────
      # Channel Resolution & Metadata
      # ──────────────────────────────────────────────
      - name: Resolve Release Channel & Version
        id: meta
        run: |
          $REF = "${{ github.ref }}"
          $REF_NAME = "${{ github.ref_name }}"
          $REF_TYPE = "${{ github.ref_type }}"
          $INPUT_CHANNEL = "${{ inputs.channel }}"

          if ($INPUT_CHANNEL -and $INPUT_CHANNEL -ne "auto") {
            $CHANNEL = $INPUT_CHANNEL
          } elseif ($REF_TYPE -eq "tag") {
            if ($REF_NAME -match "^alpha-|-alpha") { $CHANNEL = "alpha" }
            elseif ($REF_NAME -match "^beta-|-beta") { $CHANNEL = "beta" }
            elseif ($REF_NAME -match "^v[0-9]") { $CHANNEL = "release" }
            else { $CHANNEL = "beta" }
          } elseif ("${{ github.event_name }}" -eq "schedule") {
            $CHANNEL = "nightly"
          } else {
            $CHANNEL = "nightly"
          }

          $INPUT_VERSION = "${{ inputs.version }}"
          if ($INPUT_VERSION) {
            $VERSION = $INPUT_VERSION
          } elseif ($REF_TYPE -eq "tag") {
            $VERSION = $REF_NAME
          } else {
            $SHA8 = "${{ github.sha }}".Substring(0, 8)
            $VERSION = "${CHANNEL}-${SHA8}"
          }

          switch ($CHANNEL) {
            "alpha" { $CF_TYPE = "alpha" }
            "beta"  { $CF_TYPE = "beta" }
            Default { $CF_TYPE = "release" }
          }

          "channel=$CHANNEL" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$VERSION" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "cf_type=$CF_TYPE" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "=========================================================="
          Write-Host "🎯 GTE Build Channel: $CHANNEL (Version: $VERSION, CurseForge: $CF_TYPE)"
          Write-Host "=========================================================="

      # ──────────────────────────────────────────────
      # Gate 1: Submodule Lineage Lint (3s)
      # ──────────────────────────────────────────────
      - name: "[Gate 1] Submodule Lineage Lint (Anti-Wild Pointer)"
        run: python scripts/audit_submodules.py

      # ──────────────────────────────────────────────
      # Gate 2: Mixin Anti-Crash AST Lint (0.3s)
      # ──────────────────────────────────────────────
      - name: "[Gate 2] Mixin Anti-Crash AST Lint"
        run: python scripts/audit_mixins.py

      # ──────────────────────────────────────────────
      # Gate 3: Packaging Dry Run (seconds)
      # ──────────────────────────────────────────────
      # Everything after Gate 4 costs ~40 minutes (dependency warm-up, the parallel
      # module build, then the AI localization pass) before packaging is even
      # attempted, so a trivial packaging bug is only discovered at minute 42 and
      # the whole 40 minutes has to be repaid to retest a one-line fix. Run the
      # packaging scripts against the CURRENT pack tree first: they only read
      # gte/overrides and write into build/, so they do not depend on the module
      # build, and the jars they would find are last run's -- fine, because what is
      # being smoke-tested is the packaging code, not the jar contents.
      #
      # This is what would have caught the UnicodeEncodeError on the CJK pack path
      # in seconds instead of at minute 42. It sits ahead of the -Pwerror
      # pre-flight because it costs seconds while that one starts Gradle.
      - name: "[Gate 3] Packaging Scripts Dry Run"
        run: |
          $ErrorActionPreference = 'Continue'
          python scripts/build_lazy_pack.py gate-dryrun
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::build_lazy_pack.py failed on the current pack tree."
            exit $LASTEXITCODE
          }
          python scripts/build_server_pack.py gate-dryrun
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::build_server_pack.py failed on the current pack tree."
            exit $LASTEXITCODE
          }
          Remove-Item build/artifacts/GTE-LazyPack-gate-dryrun.zip, build/artifacts/GTE-Server-gate-dryrun.zip -Force -ErrorAction SilentlyContinue
          Write-Host "Packaging scripts ran clean against the current pack tree."

      # ──────────────────────────────────────────────
      # Gate 4: 5-Second Fail-Fast Pre-Flight Check
      # ──────────────────────────────────────────────
      - name: "[Gate 4] Fail-Fast Strict Compilation Pre-Flight (-Pwerror)"
        if: steps.meta.outputs.channel == 'release' || inputs.werror == true
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "⚡ Running 5-second -Werror Fail-Fast Pre-Flight Check..."
          if ($env:OS -like "*Windows*" -or $env:WINDIR) {
            cmd.exe /c "gradlew.bat :modules:gtecore:compileJava :modules:gt--:compileKotlin :modules:gtm-reborn:compileJava -Pwerror --build-cache --console=plain"
          } else {
            ./gradlew :modules:gtecore:compileJava :modules:gt--:compileKotlin :modules:gtm-reborn:compileJava -Pwerror --build-cache --console=plain
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ──────────────────────────────────────────────
      # Art Assets & Parallel Build
      # ──────────────────────────────────────────────
      - name: Synchronize Blockbench Models & Art Assets
        run: python scripts/sync_art_assets.py

      # Gradle/Java does NOT honour the HTTP_PROXY / HTTPS_PROXY environment
      # variables - it only reads systemProp.http(s).proxyHost/proxyPort. On a
      # self-hosted runner behind a proxy that means every maven request goes out
      # directly, and hosts such as cdn-alt.modrinth.com then time out
      # ("Connection timed out: getsockopt") even though curl through the proxy
      # fetches the same artifact in about a second. Translate the env vars into
      # Gradle system properties in GRADLE_USER_HOME so resolution actually uses
      # the proxy. No proxy configured means this step writes nothing.
      - name: Configure Gradle Network Proxy
        if: runner.environment == 'self-hosted'
        continue-on-error: true
        run: |
          $proxy = if ($env:HTTPS_PROXY) { $env:HTTPS_PROXY } else { $env:HTTP_PROXY }
          if (-not $proxy) {
            Write-Host "No HTTP_PROXY/HTTPS_PROXY set; Gradle will connect directly."
            exit 0
          }
          $uri = [uri]$proxy
          $noProxy = if ($env:NO_PROXY) { $env:NO_PROXY } else { "localhost,127.0.0.1" }
          $nonHosts = ($noProxy -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ }) -join '|'
          $gradleHome = if ($env:GRADLE_USER_HOME) { $env:GRADLE_USER_HOME } else { "$env:USERPROFILE\.gradle" }
          New-Item -ItemType Directory -Force -Path $gradleHome | Out-Null
          $props = Join-Path $gradleHome "gradle.properties"
          $keep = @()
          if (Test-Path $props) {
            $keep = Get-Content $props | Where-Object { $_ -notmatch '^\s*systemProp\.(http|https)\.(proxyHost|proxyPort|nonProxyHosts)\s*=' }
          }
          $keep += @(
            "systemProp.http.proxyHost=$($uri.Host)",
            "systemProp.http.proxyPort=$($uri.Port)",
            "systemProp.http.nonProxyHosts=$nonHosts",
            "systemProp.https.proxyHost=$($uri.Host)",
            "systemProp.https.proxyPort=$($uri.Port)",
            "systemProp.https.nonProxyHosts=$nonHosts"
          )
          Set-Content -Path $props -Value $keep -Encoding utf8
          Write-Host "Gradle proxy configured in $props -> $($uri.Host):$($uri.Port) (bypass: $nonHosts)"

      # Dependency resolution is the slowest and least reliable part of this build:
      # ~30 third-party maven hosts, several of which intermittently hang or time
      # out mid-stream. Resolve them up front, off the critical path, with a bounded
      # timeout and one retry so a bad mirror surfaces here instead of stalling the
      # long build step with no output.
      - name: Warm Dependency Resolution
        timeout-minutes: 25
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            Write-Host "=== Dependency resolution attempt $attempt/2 ==="
            cmd.exe /c "gradlew.bat :modules:gtm-reborn:dependencies :modules:gtecore:dependencies :modules:gt--:dependencies --configuration compileClasspath --no-daemon --console=plain" > $null 2>&1
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Dependencies resolved on attempt $attempt."
              break
            }
            Write-Host "::warning::Dependency resolution attempt $attempt failed (exit $LASTEXITCODE)."
            Get-CimInstance Win32_Process -Filter "Name='java.exe'" |
              Where-Object { $_.CommandLine -match 'GradleDaemon|GradleWrapperMain' } |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 5
          }

      - name: Build All Modules & GameTest in Parallel
        id: build_modules
        timeout-minutes: 120
        run: |
          $ErrorActionPreference = 'Continue'
          $WERROR_FLAG = ""
          if ("${{ steps.meta.outputs.channel }}" -eq "release" -or "${{ inputs.werror }}" -eq "true") {
            $WERROR_FLAG = "-Pwerror"
          }
          $TASKS = ":modules:gtm-reborn:build :modules:gtm-reborn:runGameTestServer :modules:gtecore:build :modules:gt--:build"
          # Retry once: artifact downloads from third-party maven hosts fail
          # intermittently, and a whole nightly should not be lost to one flaky CDN.
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            Write-Host "=== Build attempt $attempt/2 ==="
            if ($env:OS -like "*Windows*" -or $env:WINDIR) {
              cmd.exe /c "gradlew.bat $TASKS $WERROR_FLAG --parallel --no-daemon"
            } else {
              ./gradlew $TASKS.Split(' ') $WERROR_FLAG --parallel --no-daemon
            }
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 2) { exit $LASTEXITCODE }
            Write-Host "::warning::Build attempt $attempt failed (exit $LASTEXITCODE); retrying once."
            Get-CimInstance Win32_Process -Filter "Name='java.exe'" |
              Where-Object { $_.CommandLine -match 'GradleDaemon|GradleWrapperMain' } |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 10
          }

      - name: Build Summary Report
        if: steps.meta.outputs.channel != 'release'
        run: python scripts/summary_report.py "${{ steps.meta.outputs.channel }}"

      - name: Copy Built Mod Jars to Overrides and Artifacts
        run: |
          New-Item -ItemType Directory -Force -Path gte/overrides/mods, build/artifacts | Out-Null

          # Every publishable jar becomes a release asset...
          $publishable = Get-ChildItem -Path modules/*/build/libs -Filter "*.jar" -Recurse | Where-Object {
            $_.Name -notlike "*-sources.jar" -and $_.Name -notlike "*-dev.jar" -and $_.Name -notlike "*-all.jar"
          }
          $publishable | ForEach-Object { Copy-Item $_.FullName -Destination build/artifacts/ -Force }

          # ...but only the fat jars may enter the pack. -slim / -dev-slim are
          # built WITHOUT their jar-in-jar dependencies (ldlib, configuration,
          # Registrate, flywheel, ...) on purpose, for Maven consumers. When they
          # land in mods/, Forge sees three files declaring modId "gtceu", picks
          # a slim one, and aborts before the main menu with:
          #   Missing or unsupported mandatory dependencies:
          #     Mod ID: 'ldlib', Requested by: 'gtceu' ... [MISSING]
          $runnable = $publishable | Where-Object {
            $_.Name -notlike "*-slim.jar" -and $_.Name -notlike "*-dev-slim.jar"
          }
          $runnable | ForEach-Object { Copy-Item $_.FullName -Destination gte/overrides/mods/ -Force }

          # Two slim jars were committed to git by an earlier i18n step; drop any
          # that are still lying around so the pack we ship is actually playable.
          Get-ChildItem gte/overrides/mods -Filter "*.jar" | Where-Object {
            $_.Name -like "*-slim.jar" -or $_.Name -like "*-dev-slim.jar"
          } | ForEach-Object {
            Write-Host "::warning::Removing non-runnable jar from pack: $($_.Name)"
            Remove-Item $_.FullName -Force
          }

          Write-Host "Listing gte/overrides/mods contents:"
          Get-ChildItem gte/overrides/mods

      # ──────────────────────────────────────────────
      # Multi-Language Localization (OpenCC 0-Token + LLM)
      # Provider order is fast-chat-first: DEEPSEEK_API, then the FREE_CLAUDE
      # relay, then OpenCode Zen and Gemini as fallbacks. Asset localization is
      # request-bound (~7000 keys x 7 LLM languages), so a reasoning model as
      # primary is what pushed this step past the 6-hour job ceiling before.
      #
      # This step is deliberately NOT a gate: the mod jars and modpack artifacts
      # are already built by now, and a slow or degraded translation API must not
      # discard them. It is bounded and advisory; the per-string cache in
      # .translation_cache.json means an interrupted run resumes next time.
      # ──────────────────────────────────────────────
      # .translation_cache.json is gitignored, so without this the per-string cache
      # would be rebuilt from nothing on every hosted run and only survive on
      # self-hosted by accident of workspace reuse. Restoring it is what turns a
      # ~7000-key full translation into a small incremental delta.
      - name: Restore Translation Cache
        uses: actions/cache@v4
        with:
          path: |
            .translation_cache.json
            modules/docs/docs/.docs_cache.json
            docs/.docs_cache.json
          key: gte-translation-cache-${{ github.run_id }}
          restore-keys: |
            gte-translation-cache-

      - name: Run Global Multi-Language Localization (AI + OpenCC)
        timeout-minutes: 60
        continue-on-error: true
        env:
          DEEPSEEK_API: ${{ secrets.DEEPSEEK_API }}
          FREE_CLAUDE: ${{ secrets.FREE_CLAUDE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_MODEL: ${{ secrets.OPENCODE_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          TRANSLATE_ASSET_WORKERS: '8'
        run: python scripts/opencode_translate.py --all

      # modules/docs is a SEPARATE repository (takanashisatou/GregtechEasy-Docs).
      # actions/checkout persists the job's GITHUB_TOKEN for submodules, but that
      # token is scoped to this repository only, so pushing the translated wiki
      # failed with "Permission to ...GregtechEasy-Docs.git denied to
      # github-actions[bot] / 403". A cross-repo push needs the GH_PAT secret.
      #
      # Embedding the PAT in the push URL is NOT enough: actions/checkout persists
      # `http.https://github.com/.extraheader` with the job's GITHUB_TOKEN, and that
      # Authorization header takes precedence over URL userinfo, so the push still
      # authenticated as github-actions[bot]. The header is therefore removed for
      # the duration of the push and restored afterwards.
      #
      # Also: the previous version printed the success message unconditionally and
      # relied on the step's trailing exit code, so the log claimed the push had
      # succeeded while the job failed. Status is now checked explicitly, and the
      # outcome is exported so the root commit below refuses to record a submodule
      # pointer that upstream does not have — that mismatch is exactly what Gate 1
      # rejects as a wild pointer on the NEXT run.
      - name: Commit Submodule Translation Changes (modules/docs)
        id: docspush
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          DOCS_PUSH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          "pushed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if (-not $env:DOCS_PUSH_TOKEN) {
            Write-Host "::warning::GH_PAT is not set; skipping the cross-repo docs push."
            exit 0
          }
          Push-Location modules/docs
          try {
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            $subStatus = git status --porcelain
            if (-not $subStatus) {
              Write-Host "No docs submodule changes."
              "pushed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              exit 0
            }
            git commit -m "i18n: Auto-update multi-language wiki translations"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::warning::git commit failed in modules/docs (exit $LASTEXITCODE)."
              exit 0
            }

            # Drop the inherited GITHUB_TOKEN Authorization header so the PAT in the
            # push URL is actually the credential git presents.
            $hdrKey = "http.https://github.com/.extraheader"
            $savedHeader = git config --local --get $hdrKey
            if ($savedHeader) { git config --local --unset-all $hdrKey }
            try {
              $url = "https://x-access-token:$env:DOCS_PUSH_TOKEN@github.com/takanashisatou/GregtechEasy-Docs.git"
              git push $url HEAD:main 2>&1 | ForEach-Object { $_ -replace [regex]::Escape($env:DOCS_PUSH_TOKEN), '***' }
              $pushCode = $LASTEXITCODE
            } finally {
              if ($savedHeader) { git config --local $hdrKey $savedHeader }
            }

            if ($pushCode -eq 0) {
              Write-Host "Docs submodule changes committed and pushed to GregtechEasy-Docs@main."
              "pushed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            } else {
              Write-Host "::warning::Docs submodule push failed (exit $pushCode); the root repo will NOT record this pointer."
            }
          } finally {
            Pop-Location
          }

      # Root-repo push. Unlike the submodule above this one CAN use GITHUB_TOKEN,
      # but it must not be a gate either: the mod jars and packs are already built
      # at this point, and losing them to a transient push race would be worse
      # than a missing translation commit.
      - name: Commit Root Translation Updates
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A

          # Never record a modules/docs pointer that GregtechEasy-Docs does not have.
          # Committing an unpushed submodule commit is what made run 33071559366 fail
          # Gate 1 with "Commit 5a5ddf27 is NOT merged into origin/main".
          if ("${{ steps.docspush.outputs.pushed }}" -ne "true") {
            git restore --staged modules/docs 2>$null
            git checkout -- modules/docs 2>$null
            Write-Host "::warning::Docs submodule was not pushed upstream; its pointer bump is excluded from this commit."
          }

          $status = git status --porcelain
          if (-not $status) {
            Write-Host "No root translation changes to commit."
            exit 0
          }
          git commit -m "i18n: Auto-update multi-language assets and wiki translations"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Root i18n commit failed (exit $LASTEXITCODE)."
            exit 0
          }
          git pull --rebase origin ${{ github.ref_name }}
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Rebase onto origin/${{ github.ref_name }} failed; leaving the commit local."
            exit 0
          }
          git push
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Root translation updates committed and pushed."
          } else {
            Write-Host "::warning::Root translation push failed (exit $LASTEXITCODE)."
          }

      # Same failure shape as the docs push: this printed "triggered
      # successfully" while gh had actually returned 403, and it gated the
      # artifact pipeline that follows. Now the exit code decides the message,
      # GH_PAT is preferred (it also works when the dispatch crosses repos), and
      # the step cannot fail the build.
      - name: Trigger Docs Deploy Workflow
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
        run: |
          gh workflow run docs-deploy.yml --ref ${{ github.ref_name }}
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Docs deploy workflow triggered."
          } else {
            Write-Host "::warning::Could not trigger docs-deploy.yml (exit $LASTEXITCODE); deploy it manually if the wiki needs refreshing."
          }

      # ──────────────────────────────────────────────
      # Modpack Packaging Pipeline
      # ──────────────────────────────────────────────
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # `go install` drops the binary in $(go env GOPATH)/bin, which is NOT on PATH
      # on hosted runners (it was on the self-hosted box only because a previous
      # manual install had put it there). Add it explicitly, then prove packwiz is
      # callable so a PATH problem fails here instead of three steps later inside
      # an export.
      - name: Install Packwiz CLI
        run: |
          go install github.com/packwiz/packwiz@latest
          $gobin = Join-Path (go env GOPATH) 'bin'
          $gobin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $exe = Join-Path $gobin 'packwiz.exe'
          if (-not (Test-Path $exe)) { $exe = Join-Path $gobin 'packwiz' }
          if (-not (Test-Path $exe)) {
            Write-Host "::error::packwiz was not installed under $gobin."
            exit 1
          }
          & $exe --help *> $null
          Write-Host "packwiz installed at $exe"

      # packwiz has no notion of an "overrides" directory: everything in the pack
      # root that is not a metafile IS an override. Exporting from gte/ therefore
      # treated the literal `overrides/` folder as one more override and produced
      # overrides/overrides/mods/..., which no launcher reads -- CurseForge, PCL2,
      # HMCL and MultiMC all install from overrides/<gamedir-relative-path>. The
      # exported packs looked plausible (right size, right manifest, 17 mods) and
      # installed to a modless instance.
      #
      # So stage a flat pack root: pack.toml + index.toml beside the CONTENTS of
      # overrides/. Also drop logs/ and crash-reports/, which are local dev debris
      # that is not tracked in git but does sit in the working tree on the
      # self-hosted runner, and would otherwise be shipped to players.
      - name: Stage Flat Packwiz Root
        run: |
          $stage = "build/packwiz"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item gte/pack.toml, gte/index.toml $stage -Force
          Get-ChildItem gte/overrides -Force | Where-Object {
            $_.Name -notin @('logs', 'crash-reports', 'saves')
          } | ForEach-Object {
            Copy-Item $_.FullName -Destination $stage -Recurse -Force
          }
          Write-Host "Flat packwiz root:"
          Get-ChildItem $stage | ForEach-Object { Write-Host "  $($_.Name)" }
          $mods = @(Get-ChildItem "$stage/mods" -Filter *.jar -ErrorAction SilentlyContinue)
          Write-Host "mods staged: $($mods.Count)"
          if ($mods.Count -eq 0) {
            Write-Host "::error::No mod jars staged; the exported packs would be empty."
            exit 1
          }

      - name: Refresh Packwiz Index
        working-directory: ./build/packwiz
        run: packwiz refresh

      - name: "[Pack 1] Export CurseForge Pack"
        working-directory: ./build/packwiz
        run: |
          $out = "../artifacts/GTE-CurseForge-${{ steps.meta.outputs.version }}.zip"
          packwiz curseforge export -y -s client -o $out
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $out)) {
            Write-Host "::warning::packwiz client export failed (exit $LASTEXITCODE); falling back to a plain archive."
            Compress-Archive -Path * -DestinationPath $out -Force
          }

      - name: "[Pack 1] Patch manifest.json - enforce Java 21"
        run: python scripts/patch_manifest.py build/artifacts/GTE-CurseForge-${{ steps.meta.outputs.version }}.zip

      - name: "[Pack 2] Build Full Player Lazy Pack (.minecraft)"
        run: python scripts/build_lazy_pack.py ${{ steps.meta.outputs.version }}

      # A server pack is NOT a CurseForge pack. `packwiz curseforge export -s server`
      # emits manifest.json + overrides/, which is a launcher import format: it needs
      # a launcher to read manifest.json and copy overrides/ into place. A Forge
      # server has no launcher. The documented procedure is
      #
      #   unzip GTE-Server-*.zip -d .
      #   java -jar forge-*-installer.jar --installServer
      #   java @libraries/net/minecraftforge/forge/1.20.1-47.4.1/unix_args.txt nogui
      #
      # and Forge resolves mods/ and config/ relative to the server root, so an
      # admin following those steps got a server root whose only content was a
      # directory named `overrides` -- Forge booted with zero mods and every player
      # was rejected for a mod-list mismatch.
      #
      # The `-s server` filter was also doing nothing: packwiz reads side from mod
      # metafiles, and this pack ships mods through overrides/ (index.toml has a
      # single pack.toml entry), so client and server exports were byte-identical
      # in content -- 17 mods each, 569 entries each.
      #
      # So the server pack is built by its own script, which zips mods/, config/,
      # defaultconfigs/ and kubejs/ at the TOP level -- exactly what --installServer
      # expects to find next to it -- and also drops per-machine state that has no
      # business on someone else's server (jei/world/local bookmarks named after the
      # build machine's saves, worldedit sessions, logs, crash reports).
      #
      # It is Python rather than PowerShell on purpose: Compress-Archive writes zip
      # entry names with backslashes ("mods\gtecore-....jar"), which is not a path
      # separator in the zip spec, so consumers see one file literally named
      # "mods\gtecore-....jar" at the archive root and no mods directory at all.
      - name: "[Pack 3] Build Server Pack"
        run: python scripts/build_server_pack.py ${{ steps.meta.outputs.version }}

      # The CurseForge pack must place mods at overrides/mods/*.jar; the server pack
      # must place them at mods/*.jar. Either mistake yields a zip that installs
      # cleanly and then runs with no mods, so assert both rather than discovering it
      # from a player report.
      - name: Verify Exported Pack Layout
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $bad = $false
          $expected = @{
            'GTE-CurseForge-*.zip' = '^overrides/mods/[^/]+\.jar$'
            'GTE-Server-*.zip'     = '^mods/[^/]+\.jar$'
          }
          foreach ($pattern in $expected.Keys) {
            foreach ($zip in Get-ChildItem "build/artifacts/$pattern") {
              $archive = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
              try {
                $mods = @($archive.Entries | Where-Object { $_.FullName -match $expected[$pattern] })
                $nested = @($archive.Entries | Where-Object { $_.FullName -like 'overrides/overrides/*' })
                Write-Host "$($zip.Name): mods=$($mods.Count) nested-overrides=$($nested.Count)"
                if ($mods.Count -eq 0) {
                  Write-Host "::error::$($zip.Name) has no mods matching $($expected[$pattern]); it would install/boot with no mods."
                  $bad = $true
                }
                if ($nested.Count -gt 0) {
                  Write-Host "::error::$($zip.Name) contains overrides/overrides/; the pack root was not flattened."
                  $bad = $true
                }
              } finally {
                $archive.Dispose()
              }
            }
          }
          if ($bad) { exit 1 }

      # packwiz refresh/export rewrites index.toml hashes and pack.toml. Exports now
      # run against build/packwiz, so gte/ is untouched; this stays as a cheap guard
      # in case a future step reintroduces an in-place refresh.
      - name: Discard Packwiz Index Churn
        continue-on-error: true
        run: |
          git checkout -- gte/index.toml gte/pack.toml 2>$null
          Write-Host "Packwiz index churn discarded."

      - name: List Artifacts
        run: Get-ChildItem build/artifacts

      # ──────────────────────────────────────────────
      # Artifact Upload (30 Days)
      # ──────────────────────────────────────────────
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GTE-${{ steps.meta.outputs.channel }}-${{ steps.meta.outputs.version }}
          path: build/artifacts/
          retention-days: 30

      # ──────────────────────────────────────────────
      # GitHub Releases & Tag Publishing
      # ──────────────────────────────────────────────
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $prereleaseFlag = if ("${{ steps.meta.outputs.channel }}" -ne "release") { "--prerelease" } else { "" }
          $files = (Get-ChildItem build/artifacts/*).FullName
          gh release create "${{ steps.meta.outputs.version }}" $files --title "GregTech Easy ${{ steps.meta.outputs.version }} (${{ steps.meta.outputs.channel }})" --generate-notes $prereleaseFlag

      # A nightly is dispatched against a BRANCH, so the tag-gated step above never
      # runs and nightly artifacts previously lived only in the 30-day workflow
      # artifact. This publishes the same files to a rolling `nightly` prerelease
      # (the tag that already carries the historical nightly builds), replacing its
      # assets each time so the tag always points at the newest nightly.
      - name: Publish Rolling Nightly Prerelease
        if: steps.meta.outputs.channel == 'nightly' && github.ref_type == 'branch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $sha8 = "${{ github.sha }}".Substring(0, 8)
          $title = "GregTech Easy $version ($sha8)"
          $files = (Get-ChildItem build/artifacts/*).FullName
          if (-not $files) {
            Write-Host "::error::No artifacts in build/artifacts; refusing to publish an empty nightly."
            exit 1
          }
          Write-Host "Publishing $($files.Count) asset(s) to the rolling 'nightly' prerelease:"
          $files | ForEach-Object { Write-Host "  $(Split-Path $_ -Leaf)" }

          gh release view nightly --repo ${{ github.repository }} > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
            gh release edit nightly --repo ${{ github.repository }} --title $title --prerelease --notes "Automated nightly build of ``$version`` from ``${{ github.sha }}``.`n`nRolling prerelease: assets are replaced on every nightly run."
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release upload nightly --repo ${{ github.repository }} $files --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            # `gh release edit --target` is silently ignored once the tag exists, so
            # the rolling tag kept pointing at an ancient commit while the assets were
            # current. Move the ref explicitly.
            gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/nightly" -f sha='${{ github.sha }}' -F force=true > $null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Rolling tag 'nightly' retargeted to ${{ github.sha }}."
            } else {
              Write-Host "::warning::Could not retarget the 'nightly' tag; assets are current but the tag still points elsewhere."
            }
          } else {
            gh release create nightly --repo ${{ github.repository }} $files --target ${{ github.sha }} --title $title --prerelease --notes "Automated nightly build of ``$version`` from ``${{ github.sha }}``."
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Write-Host "Nightly prerelease published: https://github.com/${{ github.repository }}/releases/tag/nightly"

          # `gh release upload --clobber` replaces same-named assets but never removes
          # ones this run did not produce, so the rolling release accumulated files
          # from the 1.9.1 era next to current jars — users saw ancient packs
          # presented as the newest nightly. A rolling tag must show exactly one
          # build, so anything not produced by this run is deleted.
          #
          # This only ever touches the `nightly` prerelease. Versioned releases
          # (v1.9.1, v1.9.5, v2.2.3.5, ...) are never modified, and each stale file
          # here also exists on its own version tag, so no last copy is destroyed.
          $current = $files | ForEach-Object { Split-Path $_ -Leaf }
          $existing = gh release view nightly --repo ${{ github.repository }} --json assets --jq '.assets[].name'
          $stale = @($existing | Where-Object { $current -notcontains $_ })
          if ($stale.Count -gt 0) {
            Write-Host "Pruning $($stale.Count) asset(s) not produced by this build:"
            foreach ($name in $stale) {
              gh release delete-asset nightly $name --repo ${{ github.repository }} --yes
              if ($LASTEXITCODE -eq 0) {
                Write-Host "  removed $name"
              } else {
                Write-Host "::warning::Could not remove stale asset $name (exit $LASTEXITCODE)."
              }
            }
          } else {
            Write-Host "No stale assets on the nightly release."
          }

      # ──────────────────────────────────────────────
      # Publish to CurseForge Platform (Release Channel Only)
      # ──────────────────────────────────────────────
      - name: Publish to CurseForge Platform (Release Only)
        if: steps.meta.outputs.channel == 'release' && env.CURSEFORGE_TOKEN != ''
        uses: Kir-Antipov/mc-publish@v3.3
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        with:
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-id: 1347911
          files: build/artifacts/GTE-CurseForge-*.zip
          name: GregTech Easy ${{ steps.meta.outputs.version }}
          version-type: release
          loaders: forge
          game-versions: |
            1.20.1
            Java 21

      # ──────────────────────────────────────────────
      # Publish Maven Artifacts to GitHub Pages
      # ──────────────────────────────────────────────
      - name: Build Maven Artifacts
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path build/maven | Out-Null
          if ($env:OS -like "*Windows*" -or $env:WINDIR) {
            cmd.exe /c "gradlew.bat :modules:gtecore:publish :modules:gtm-reborn:publish :modules:gt--:publish -PmavenDir=""${{ github.workspace }}/build/maven"" -x test"
          } else {
            ./gradlew :modules:gtecore:publish :modules:gtm-reborn:publish :modules:gt--:publish -PmavenDir="${{ github.workspace }}/build/maven" -x test
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Deploy Maven to GitHub Pages
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/maven
          destination_dir: maven
          keep_files: true
          cname: ''