name: "GTE-Multi CI/CD Build & Multi-Channel Release"

on:
  push:
    branches:
      - master
      - main
      - dev
      - satou
    tags:
      - 'v*'
      - 'alpha-*'
      - 'beta-*'
  pull_request:
    branches:
      - master
      - main
      - dev
      - satou
  schedule:
    - cron: '0 2 * * *' # Daily Nightly build at 02:00 UTC
  workflow_dispatch:
    inputs:
      channel:
        description: "Release Channel"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - nightly
          - alpha
          - beta
          - release
      version:
        description: "Custom Version (e.g. 3.0.0, nightly-3.0.0)"
        required: false
        default: ""
        type: string
      werror:
        description: "Force -Werror (Warning as Error)"
        required: false
        default: false
        type: boolean
      runner:
        description: "Runner environment"
        required: false
        default: "self-hosted"
        type: choice
        options:
          - self-hosted
          - ubuntu-latest
          - windows-latest

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-sync:
    name: "GTE-Multi Build, Test, Translate & Sync"
    runs-on: ${{ inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || inputs.runner == 'windows-latest' && 'windows-latest' || fromJSON('["self-hosted", "Windows", "X64"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository & Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        continue-on-error: true
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ──────────────────────────────────────────────
      # Channel Resolution & Metadata
      # ──────────────────────────────────────────────
      - name: Resolve Release Channel & Version
        id: meta
        run: |
          REF="${{ github.ref }}"
          REF_NAME="${{ github.ref_name }}"
          REF_TYPE="${{ github.ref_type }}"
          INPUT_CHANNEL="${{ inputs.channel }}"

          if [ -n "$INPUT_CHANNEL" ] && [ "$INPUT_CHANNEL" != "auto" ]; then
            CHANNEL="$INPUT_CHANNEL"
          elif [ "$REF_TYPE" = "tag" ]; then
            if [[ "$REF_NAME" =~ ^alpha- || "$REF_NAME" =~ -alpha ]]; then
              CHANNEL="alpha"
            elif [[ "$REF_NAME" =~ ^beta- || "$REF_NAME" =~ -beta ]]; then
              CHANNEL="beta"
            elif [[ "$REF_NAME" =~ ^v[0-9] ]]; then
              CHANNEL="release"
            else
              CHANNEL="beta"
            fi
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            CHANNEL="nightly"
          else
            CHANNEL="nightly"
          fi

          INPUT_VERSION="${{ inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          elif [ "$REF_TYPE" = "tag" ]; then
            VERSION="$REF_NAME"
          else
            VERSION="${CHANNEL}-${GITHUB_SHA::8}"
          fi

          case "$CHANNEL" in
            alpha)
              CF_TYPE="alpha"
              ;;
            beta)
              CF_TYPE="beta"
              ;;
            *)
              CF_TYPE="release"
              ;;
          esac

          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "cf_type=$CF_TYPE" >> "$GITHUB_OUTPUT"
          echo "=========================================================="
          echo "🎯 GTE Build Channel: $CHANNEL (Version: $VERSION, CurseForge: $CF_TYPE)"
          echo "=========================================================="

      # ──────────────────────────────────────────────
      # Gate 1: Submodule Lineage Lint (3s)
      # ──────────────────────────────────────────────
      - name: "[Gate 1] Submodule Lineage Lint (Anti-Wild Pointer)"
        run: python scripts/audit_submodules.py

      # ──────────────────────────────────────────────
      # Gate 2: Mixin Anti-Crash AST Lint (0.3s)
      # ──────────────────────────────────────────────
      - name: "[Gate 2] Mixin Anti-Crash AST Lint"
        run: python scripts/audit_mixins.py

      # ──────────────────────────────────────────────
      # Gate 3: 5-Second Fail-Fast Pre-Flight Check
      # ──────────────────────────────────────────────
      - name: "[Gate 3] Fail-Fast Strict Compilation Pre-Flight (-Pwerror)"
        if: steps.meta.outputs.channel == 'release' || inputs.werror == true
        run: |
          echo "⚡ Running 5-second -Werror Fail-Fast Pre-Flight Check..."
          ./gradlew \
            :modules:gtecore:compileJava \
            :modules:gt--:compileKotlin \
            :modules:gtm-reborn:compileJava \
            -Pwerror \
            --build-cache \
            --console=plain

      # ──────────────────────────────────────────────
      # Art Assets & Parallel Build
      # ──────────────────────────────────────────────
      - name: Synchronize Blockbench Models & Art Assets
        run: python scripts/sync_art_assets.py

      - name: Build All Modules & GameTest in Parallel
        id: build_modules
        run: |
          WERROR_FLAG=""
          if [ "${{ steps.meta.outputs.channel }}" = "release" ] || [ "${{ inputs.werror }}" = "true" ]; then
            WERROR_FLAG="-Pwerror"
          fi

          ./gradlew \
            :modules:gtm-reborn:build \
            :modules:gtm-reborn:runGameTestServer \
            :modules:gtecore:build \
            :modules:gt--:build \
            $WERROR_FLAG \
            --parallel \
            --no-daemon \
            2>&1 | tee build.log

      - name: Warning Countdown Summary (Beta / Dev Notice)
        if: steps.meta.outputs.channel != 'release'
        run: |
          WARN_COUNT=$(grep -ci "warning:" build.log || true)
          echo "### ⚠️ Build Quality Inspection" >> $GITHUB_STEP_SUMMARY
          if [ "$WARN_COUNT" -gt "0" ]; then
            echo "> ⚠️ **[Release 预警]** 检测到 **${WARN_COUNT}** 处代码 Warning。当前 **${{ steps.meta.outputs.channel }}** 阶段已放行，请在合入正式版前清理！" >> $GITHUB_STEP_SUMMARY
          else
            echo "> ✅ **[零警告]** 代码质量完美，0 Warning 通过！" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Copy Built Mod Jars to Overrides and Artifacts
        run: |
          mkdir -p gte/overrides/mods
          mkdir -p build/artifacts
          find modules/gtm-reborn/build/libs/ -maxdepth 1 -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" ! -name "*-all.jar" -exec cp {} gte/overrides/mods/ \;
          find modules/gtecore/build/libs/ -maxdepth 1 -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" ! -name "*-all.jar" -exec cp {} gte/overrides/mods/ \;
          find modules/gt--/build/libs/ -maxdepth 1 -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" ! -name "*-all.jar" -exec cp {} gte/overrides/mods/ \;
          find modules/gtm-reborn/build/libs/ -maxdepth 1 -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" ! -name "*-all.jar" -exec cp {} build/artifacts/ \;
          find modules/gtecore/build/libs/ -maxdepth 1 -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" ! -name "*-all.jar" -exec cp {} build/artifacts/ \;
          find modules/gt--/build/libs/ -maxdepth 1 -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" ! -name "*-all.jar" -exec cp {} build/artifacts/ \;
          echo "Listing gte/overrides/mods contents:"
          ls -la gte/overrides/mods/

      # ──────────────────────────────────────────────
      # Multi-Language Localization (OpenCC 0-Token + LLM)
      # ──────────────────────────────────────────────
      - name: Run Global Multi-Language Localization (AI + OpenCC)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python scripts/opencode_translate.py

      # ──────────────────────────────────────────────
      # Modpack Packaging Pipeline
      # ──────────────────────────────────────────────
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Packwiz CLI
        run: go install github.com/packwiz/packwiz@latest

      - name: Refresh Packwiz Index
        working-directory: ./gte
        run: packwiz refresh

      - name: "[Pack 1] Export CurseForge Pack"
        working-directory: ./gte
        run: |
          packwiz curseforge export -o ../build/artifacts/GTE-CurseForge-${{ steps.meta.outputs.version }}.zip \
            || (cd .. && zip -r build/artifacts/GTE-CurseForge-${{ steps.meta.outputs.version }}.zip gte/)

      - name: "[Pack 1] Patch manifest.json - enforce Java 21"
        run: python scripts/patch_manifest.py build/artifacts/GTE-CurseForge-${{ steps.meta.outputs.version }}.zip

      - name: "[Pack 2] Build Full Player Lazy Pack (.minecraft)"
        run: python scripts/build_lazy_pack.py ${{ steps.meta.outputs.version }}

      - name: "[Pack 3] Export Server Pack"
        working-directory: ./gte
        run: |
          packwiz server export -o ../build/artifacts/GTE-Server-${{ steps.meta.outputs.version }}.zip \
            || (cd .. && zip -r build/artifacts/GTE-Server-${{ steps.meta.outputs.version }}.zip gte/overrides/)

      - name: List Artifacts
        run: ls -lh build/artifacts/

      # ──────────────────────────────────────────────
      # Artifact Upload (30 Days)
      # ──────────────────────────────────────────────
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GTE-${{ steps.meta.outputs.channel }}-${{ steps.meta.outputs.version }}
          path: build/artifacts/
          retention-days: 30

      # ──────────────────────────────────────────────
      # GitHub Releases & Tag Publishing
      # ──────────────────────────────────────────────
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ steps.meta.outputs.channel }}" != "release" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "${{ steps.meta.outputs.version }}" \
            build/artifacts/* \
            --title "GregTech Easy ${{ steps.meta.outputs.version }} (${{ steps.meta.outputs.channel }})" \
            --generate-notes \
            $PRERELEASE_FLAG || echo "Release already exists or updated."

      # ──────────────────────────────────────────────
      # Publish to CurseForge Platform (Release Channel Only)
      # ──────────────────────────────────────────────
      - name: Publish to CurseForge Platform (Release Only)
        if: steps.meta.outputs.channel == 'release' && env.CURSEFORGE_TOKEN != ''
        uses: Kir-Antipov/mc-publish@v3.3
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        with:
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-id: 1347911
          files: build/artifacts/GTE-CurseForge-*.zip
          name: GregTech Easy ${{ steps.meta.outputs.version }}
          version-type: release
          loaders: forge
          game-versions: |
            1.20.1
            Java 21

      # ──────────────────────────────────────────────
      # Build Multi-Lingual Documentation & Deploy to GitHub Pages
      # ──────────────────────────────────────────────
      - name: Build and Publish Maven Artifacts
        run: |
          mkdir -p build/maven
          ./gradlew :modules:gtecore:publish :modules:gtm-reborn:publish :modules:gt--:publish -PmavenDir="${{ github.workspace }}/build/maven" -x test

      - name: Build Multi-Lingual Documentation (MkDocs)
        run: |
          if [ -f "modules/docs/mkdocs.yml" ]; then
            mkdocs build -f modules/docs/mkdocs.yml -d ../../build/site
          else
            mkdocs build -d build/site
          fi
          mkdir -p build/site
          cp -rn build/maven/* build/site/ || cp -r build/maven/* build/site/ || true
          echo "Site and Maven artifacts merged:"
          ls -la build/site/

      - name: Deploy Docs & Maven to GitHub Pages
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/site
          keep_files: true
          cname: ''
