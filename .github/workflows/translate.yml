name: "AI Multi-Language Translation"

on:
  workflow_dispatch:
    inputs:
      target_langs:
        description: "Target language codes (e.g. 'all', or 'zh_tw,zh_hk,ru_ru,ja_jp')"
        required: false
        default: "all"
        type: string
      opencc_only:
        description: "Run only OpenCC Traditional Chinese conversion (0 Token cost, no API key needed)"
        required: false
        default: false
        type: boolean
      provider:
        description: "LLM Provider to use (if running AI translation)"
        required: false
        default: "deepseek"
        type: choice
        options:
          - deepseek
          - gemini
          - openai
          - dashscope
          - moonshot
          - zhipu
          - opencode
      custom_api_key:
        description: "Custom API key (leave blank to use repository secret)"
        required: false
        default: ""
        type: string
      create_pr:
        description: "Create Pull Request for updated translations (instead of direct push)"
        required: false
        default: false
        type: boolean
      translate_docs:
        description: "Also translate Markdown documentation (docs/zh/ -> docs/en/ and other locales)"
        required: false
        default: true
        type: boolean
      force:
        description: "Force re-translation of all files (ignores SHA cache, use when previous run wrote untranslated fallback)"
        required: false
        default: false
        type: boolean

  # Allow other workflows (e.g. sync-build.yml) to call this workflow
  workflow_call:
    inputs:
      target_langs:
        type: string
        required: false
        default: "all"
      translate_docs:
        type: boolean
        required: false
        default: true
      force:
        type: boolean
        required: false
        default: false
      create_pr:
        type: boolean
        required: false
        default: false
    secrets:
      DEEPSEEK_API_KEY:
        required: false
      GEMINI_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      DASHSCOPE_API_KEY:
        required: false
      MOONSHOT_API_KEY:
        required: false
      ZHIPU_API_KEY:
        required: false
      OPENCODE_API_KEY:
        required: false
      LLM_API_KEY:
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    name: "Translate Language Files & Quests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Localization Engine
        env:
          DEEPSEEK_API_KEY: ${{ inputs.custom_api_key || secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ inputs.custom_api_key || secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ inputs.custom_api_key || secrets.OPENAI_API_KEY }}
          DASHSCOPE_API_KEY: ${{ inputs.custom_api_key || secrets.DASHSCOPE_API_KEY }}
          MOONSHOT_API_KEY: ${{ inputs.custom_api_key || secrets.MOONSHOT_API_KEY }}
          ZHIPU_API_KEY: ${{ inputs.custom_api_key || secrets.ZHIPU_API_KEY }}
          OPENCODE_API_KEY: ${{ inputs.custom_api_key || secrets.OPENCODE_API_KEY }}
          LLM_API_KEY: ${{ inputs.custom_api_key || secrets.LLM_API_KEY }}
        run: |
          ARGS="--langs ${{ inputs.target_langs || 'all' }}"
          if [ "${{ inputs.opencc_only }}" = "true" ]; then
            ARGS="$ARGS --opencc-only"
          fi
          if [ "${{ inputs.translate_docs }}" = "true" ]; then
            ARGS="$ARGS --docs-dir modules/docs/docs"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python scripts/opencode_translate.py $ARGS

      - name: Check for Changes
        id: git_status
        run: |
          # Check both root repo and submodules for changes
          ROOT_CHANGES=$(git status --porcelain)
          DOCS_CHANGES=$(cd modules/docs && git status --porcelain)
          echo "Root changes: $ROOT_CHANGES"
          echo "Docs submodule changes: $DOCS_CHANGES"
          if [ -n "$ROOT_CHANGES" ] || [ -n "$DOCS_CHANGES" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit Submodule Changes (modules/docs)
        if: steps.git_status.outputs.has_changes == 'true'
        run: |
          cd modules/docs
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "i18n: Auto-update multi-language wiki translations"
            git push origin HEAD:main
            echo "✅ Docs submodule changes committed and pushed."
          else
            echo "ℹ️ No docs submodule changes."
          fi

      - name: Commit and Direct Push
        if: steps.git_status.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage all root-level changes including updated submodule pointer
          git add -A
          if git diff --cached --quiet; then
            echo "ℹ️ No root-level changes to commit."
          else
            BRANCH="${{ inputs.create_pr == true && 'i18n-update-' || '' }}"
            if [ "${{ inputs.create_pr }}" = "true" ]; then
              BRANCH_NAME="i18n-update-$(date +%Y%m%d%H%M%S)"
              git checkout -b "$BRANCH_NAME"
              git commit -m "i18n: Update multi-language assets, wiki translations, and submodule pointer"
              git push origin "$BRANCH_NAME"
              gh pr create \
                --title "i18n: Multi-language Localization Update ($(date +%Y-%m-%d))" \
                --body "Automated multi-language localization generated by \`scripts/opencode_translate.py\`." \
                --base main \
                --head "$BRANCH_NAME"
            else
              git commit -m "i18n: Update multi-language assets, wiki translations, and submodule pointer"
              git pull --rebase origin main
              git push
            fi
            echo "✅ Root repo changes committed and pushed."
          fi
