name: "AI Multi-Language Translation"

on:
  workflow_dispatch:
    inputs:
      target_langs:
        description: "Target language codes (e.g. 'all', or 'zh_tw,zh_hk,ru_ru,ja_jp')"
        required: false
        default: "all"
        type: string
      opencc_only:
        description: "Run only OpenCC Traditional Chinese conversion (0 Token cost, no API key needed)"
        required: false
        default: false
        type: boolean
      provider:
        description: "LLM Provider to use (if running AI translation)"
        required: false
        default: "deepseek"
        type: choice
        options:
          - deepseek
          - gemini
          - openai
          - dashscope
          - moonshot
          - zhipu
          - opencode
      custom_api_key:
        description: "Custom API key (leave blank to use repository secret)"
        required: false
        default: ""
        type: string
      create_pr:
        description: "Create Pull Request for updated translations (instead of direct push)"
        required: false
        default: true
        type: boolean
      translate_docs:
        description: "Also translate Markdown documentation (docs/zh/ -> docs/en/ and other locales)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    name: "Translate Language Files & Quests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Localization Engine
        env:
          DEEPSEEK_API_KEY: ${{ inputs.custom_api_key || secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ inputs.custom_api_key || secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ inputs.custom_api_key || secrets.OPENAI_API_KEY }}
          DASHSCOPE_API_KEY: ${{ inputs.custom_api_key || secrets.DASHSCOPE_API_KEY }}
          MOONSHOT_API_KEY: ${{ inputs.custom_api_key || secrets.MOONSHOT_API_KEY }}
          ZHIPU_API_KEY: ${{ inputs.custom_api_key || secrets.ZHIPU_API_KEY }}
          OPENCODE_API_KEY: ${{ inputs.custom_api_key || secrets.OPENCODE_API_KEY }}
          LLM_API_KEY: ${{ inputs.custom_api_key || secrets.LLM_API_KEY }}
        run: |
          ARGS="--langs ${{ inputs.target_langs }}"
          if [ "${{ inputs.opencc_only }}" = "true" ]; then
            ARGS="$ARGS --opencc-only"
          fi
          if [ "${{ inputs.translate_docs }}" = "true" ]; then
            ARGS="$ARGS --docs"
          fi
          python scripts/opencode_translate.py $ARGS

      - name: Check for Changes
        id: git_status
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and Create PR
        if: steps.git_status.outputs.has_changes == 'true' && inputs.create_pr == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH_NAME="i18n-update-$(date +%Y%m%d%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          git add -A
          git commit -m "i18n: Update multi-language assets and FTB quest dictionaries"
          git push origin "$BRANCH_NAME"
          gh pr create \
            --title "i18n: Multi-language Localization Update ($(date +%Y-%m-%d))" \
            --body "Automated multi-language localization generated by \`scripts/opencode_translate.py\`." \
            --base main \
            --head "$BRANCH_NAME"

      - name: Commit and Direct Push
        if: steps.git_status.outputs.has_changes == 'true' && inputs.create_pr == false
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "i18n: Update multi-language assets and FTB quest dictionaries"
          git push
