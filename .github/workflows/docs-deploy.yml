name: "Deploy GTE Documentation & Wiki"

on:
  push:
    branches:
      - master
      - main
    paths:
      - "modules/docs/**"
      - "docs/**"
      - "mkdocs.yml"
      - "requirements.txt"
      - "scripts/audit_docs.py"
      - ".github/workflows/docs-deploy.yml"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "modules/docs/**"
      - "docs/**"
      - "mkdocs.yml"
      - "requirements.txt"
      - "scripts/audit_docs.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  deploy-docs:
    name: "Fast MkDocs Build & Deploy (15s)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository & Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Documentation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "[Gate 1] Documentation Cleanliness & Symmetry Audit (0.5s)"
        run: python scripts/audit_docs.py

      - name: "[Gate 2] Build MkDocs Site with Strict 404 Checks"
        run: |
          if [ -f "modules/docs/mkdocs.yml" ]; then
            mkdocs build --strict -f modules/docs/mkdocs.yml -d ../../build/site
          else
            mkdocs build --strict -d build/site
          fi

      - name: Deploy to GitHub Pages (gh-pages)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/site
          keep_files: true
          cname: ''
