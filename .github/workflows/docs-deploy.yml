name: "Deploy GTE Documentation & Wiki"

on:
  push:
    branches:
      - master
      - main
    paths:
      - "modules/docs/**"
      - "docs/**"
      - "mkdocs.yml"
      - "requirements.txt"
      - "scripts/audit_docs.py"
      - ".github/workflows/docs-deploy.yml"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "modules/docs/**"
      - "docs/**"
      - "mkdocs.yml"
      - "requirements.txt"
      - "scripts/audit_docs.py"
  workflow_dispatch:

  # Allow other workflows to trigger docs deploy
  workflow_call:
    secrets:
      GH_PAT:
        required: false

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  deploy-docs:
    name: "Fast MkDocs Build & Deploy (15s)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository & Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Documentation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: "[Gate 1] Documentation Cleanliness & Symmetry Audit (0.5s)"
        run: python scripts/audit_docs.py

      - name: "[Gate 1.5] Translation Completeness Audit — all 10 languages 100%"
        run: python scripts/audit_translations.py

      - name: "[Gate 2] Build MkDocs Site with Strict 404 Checks"
        # Build from the submodule's mkdocs.yml — modules/docs/docs/ is the source of truth
        # for documentation and receives AI translations from the CI pipeline.
        # NOTE: -d is relative to the config file, so we use absolute path for publish_dir compatibility.
        run: mkdocs build -f modules/docs/mkdocs.yml --strict -d "$(pwd)/build/site"

      - name: Deploy to takanashisatou.github.io (root site)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAT }}
          external_repository: takanashisatou/takanashisatou.github.io
          publish_branch: master
          publish_dir: ./build/site
          keep_files: false
