name: "CurseForge Publish (two stages)"

# Upload modules first. After moderation, resume with their recorded exact file IDs.
# This workflow publishes the committed production jars already tested by sync-build;
# it never recompiles a different set or adds jars to the modpack archive.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "check: no upload; modules: upload three jars; pack: after moderation"
        type: choice
        required: true
        default: check
        options: [check, modules, pack]
      version:
        description: "Modpack release version (reuse the same value for both stages)"
        required: true
        type: string
      channel:
        description: "CurseForge release type"
        type: choice
        default: release
        options: [release, beta, alpha]
      module_release_run_id:
        description: "Successful modules-stage Actions run ID (required for pack)"
        type: string
        default: ""
      modules_approved:
        description: "For pack: all three module files have passed CurseForge moderation"
        type: boolean
        default: false
      gtecore_cf_id:
        description: "GTE Core CurseForge project"
        type: string
        default: "1332244"
      gtm_reborn_cf_id:
        description: "GTM Reborn CurseForge project"
        type: string
        default: "1347911"
      gt_minus_cf_id:
        description: "GT-- Community Edition CurseForge project"
        type: string
        default: "1353895"
      modpack_cf_id:
        description: "GregTech Easy modpack CurseForge project"
        type: string
        default: "1332016"
      changelog:
        description: "Release changelog (Markdown)"
        type: string
        default: "Release update for GregTech Easy."

permissions:
  contents: read
  actions: read

# Do not cancel an upload halfway through; the record may contain already-uploaded files.
concurrency:
  group: curseforge-release
  cancel-in-progress: false

jobs:
  publish:
    name: "CurseForge release: ${{ inputs.stage }}"
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_STAGE: ${{ inputs.stage }}
      MODULE_RELEASE_RUN: ${{ inputs.module_release_run_id }}
      MODULES_APPROVED: ${{ inputs.modules_approved }}
      GTECORE_CF_ID: ${{ inputs.gtecore_cf_id }}
      GTM_REBORN_CF_ID: ${{ inputs.gtm_reborn_cf_id }}
      GT_MINUS_CF_ID: ${{ inputs.gt_minus_cf_id }}
      MODPACK_CF_ID: ${{ inputs.modpack_cf_id }}
    steps:
      - name: Checkout committed pack
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate stage and token configuration
        env:
          CF_UPLOAD_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          if ($env:RELEASE_STAGE -ne 'check') {
            if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Publish from main after the release PR has merged.' }
            if (-not $env:CF_UPLOAD_TOKEN) { throw 'Configure the CURSEFORGE_TOKEN repository secret.' }
          }
          if ($env:RELEASE_STAGE -eq 'pack') {
            if ($env:MODULES_APPROVED -ne 'true') { throw 'Wait until all three module files pass CurseForge moderation, then select modules_approved.' }
            if ($env:MODULE_RELEASE_RUN -notmatch '^[1-9][0-9]*$') { throw 'Provide the successful modules-stage run ID.' }
          }

      - name: Pack production gates
        run: |
          foreach ($script in @('audit_modids.py', 'audit_pack_mappings.py', 'audit_module_jar_freshness.py', 'audit_dev_pack_parity.py')) {
            python "scripts/$script"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python -m unittest discover -s scripts -p test_curseforge_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Read-only Upload API token check
        env:
          CF_UPLOAD_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: python scripts/curseforge_release.py check-token

      - name: Prepare pinned module release
        if: inputs.stage != 'pack'
        id: prepared
        run: python scripts/curseforge_release.py prepare

      - name: Upload GTE Core jar
        if: inputs.stage == 'modules'
        id: core
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-id: ${{ steps.prepared.outputs.gtecore_project }}
          files: ${{ steps.prepared.outputs.gtecore_jar }}
          name: "GTE Core for GregTech Easy ${{ inputs.version }}"
          version-type: ${{ inputs.channel }}
          loaders: forge
          game-versions: 1.20.1
          java: 21
          changelog: ${{ inputs.changelog }}
          retry-attempts: 1

      - name: Upload GTM Reborn jar
        if: inputs.stage == 'modules'
        id: gtm
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-id: ${{ steps.prepared.outputs.gtm_reborn_project }}
          files: ${{ steps.prepared.outputs.gtm_reborn_jar }}
          name: "GTM Reborn for GregTech Easy ${{ inputs.version }}"
          version-type: ${{ inputs.channel }}
          loaders: forge
          game-versions: 1.20.1
          java: 21
          changelog: ${{ inputs.changelog }}
          retry-attempts: 1

      - name: Upload GT-- CE jar
        if: inputs.stage == 'modules'
        id: gtminus
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-id: ${{ steps.prepared.outputs.gt_minus_project }}
          files: ${{ steps.prepared.outputs.gt_minus_jar }}
          name: "GT-- CE for GregTech Easy ${{ inputs.version }}"
          version-type: ${{ inputs.channel }}
          loaders: forge
          game-versions: 1.20.1
          java: 21
          changelog: ${{ inputs.changelog }}
          retry-attempts: 1

      - name: Save returned file IDs (including partial upload records)
        if: always() && inputs.stage == 'modules' && steps.prepared.outcome == 'success'
        env:
          GTECORE_FILE_ID: ${{ steps.core.outputs.curseforge-version }}
          GTM_REBORN_FILE_ID: ${{ steps.gtm.outputs.curseforge-version }}
          GT_MINUS_FILE_ID: ${{ steps.gtminus.outputs.curseforge-version }}
        run: python scripts/curseforge_release.py record

      - name: Keep module release record for the post-moderation stage
        if: always() && inputs.stage == 'modules' && steps.prepared.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: curseforge-module-release
          path: build/curseforge/module-release.json
          if-no-files-found: error
          retention-days: 90

      - name: Read successful module release record
        if: inputs.stage == 'pack'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:MODULE_RELEASE_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($run.conclusion -ne 'success' -or $run.path -ne '.github/workflows/curseforge-publish.yml') { throw 'Select a successful modules-stage run from this workflow.' }
          gh run download $env:MODULE_RELEASE_RUN --repo $env:GITHUB_REPOSITORY --name curseforge-module-release --dir build/curseforge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify unauthenticated downloads match all manifest pins
        if: inputs.stage == 'pack'
        run: python scripts/curseforge_release.py verify

      - name: Build and validate zero-jar CurseForge archive
        if: inputs.stage == 'pack'
        run: python scripts/build_curseforge_pack.py "$env:RELEASE_VERSION" --module-release build/curseforge/module-release.json

      - name: Preserve exact archive before upload
        if: inputs.stage == 'pack'
        uses: actions/upload-artifact@v4
        with:
          name: GTE-CurseForge-${{ inputs.version }}
          path: build/artifacts/GTE-CurseForge-${{ inputs.version }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload modpack only after public-download and zero-jar checks
        if: inputs.stage == 'pack'
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-id: ${{ inputs.modpack_cf_id }}
          files: build/artifacts/GTE-CurseForge-${{ inputs.version }}.zip
          name: "GregTech Easy ${{ inputs.version }} (Use Java 21)"
          version-type: ${{ inputs.channel }}
          loaders: forge
          game-versions: 1.20.1
          java: 21
          changelog: ${{ inputs.changelog }}
          retry-attempts: 1
