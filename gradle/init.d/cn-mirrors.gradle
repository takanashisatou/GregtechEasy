/**
 * gradle/init.d/cn-mirrors.gradle
 *
 * 中国大陆 Maven / Gradle 镜像加速脚本。
 * 自动加速：
 *   - Maven Central  -> 阿里云 Central 镜像
 *   - Gradle Plugins -> 阿里云 Gradle Plugin 镜像
 *   - Google Maven   -> 阿里云 Google 镜像
 *   - Forge Maven    -> BMCLAPI 镜像 (bangbang93)
 *   - Raw GitHub     -> gitmirror 镜像
 *
 * 如需禁用此镜像（CI 或海外环境），设置环境变量：
 *   GTE_NO_CN_MIRROR=1
 */

import groovy.transform.Field

def isChinaEnvironment = {
    if (System.getenv("GTE_NO_CN_MIRROR") == "1") return false
    if (System.getenv("GTE_FORCE_CN_MIRROR") == "1") return true
    def lang = Locale.getDefault().getLanguage()?.toLowerCase()
    def country = Locale.getDefault().getCountry()?.toLowerCase()
    def tz = TimeZone.getDefault().getID()
    return lang == "zh" || country == "cn" || tz?.contains("Shanghai") || tz?.contains("Chongqing") || tz?.contains("Urumqi") || tz?.contains("Harbin")
}

if (!isChinaEnvironment()) {
    // Foreign users or CI environment: completely untouched, 100% official upstream
    return
}

logger.lifecycle("[CN Mirror] China locale detected. Applying China Maven mirrors (Aliyun + BMCLAPI)...")

@Field
final Map<String, String> MIRROR_MAP = [
    "https://repo.maven.apache.org/maven2"          : "https://maven.aliyun.com/repository/public",
    "https://repo1.maven.org/maven2"                : "https://maven.aliyun.com/repository/public",
    "https://jcenter.bintray.com"                   : "https://maven.aliyun.com/repository/public",
    "https://plugins.gradle.org/m2"                 : "https://maven.aliyun.com/repository/gradle-plugin",
    "https://dl.google.com/dl/android/maven2"       : "https://maven.aliyun.com/repository/google",
]

def applyMirrors(RepositoryHandler repos) {
    repos.all { repo ->
        if (repo instanceof MavenArtifactRepository) {
            def original = repo.url?.toString()
            if (original) {
                MIRROR_MAP.each { orig, mirror ->
                    if (original.startsWith(orig)) {
                        def newUrl = original.replace(orig, mirror)
                        repo.setUrl(newUrl)
                        logger.info("[CN Mirror] {} -> {}", original, newUrl)
                    }
                }
            }
        }
    }
}

// 作用于所有子模块
allprojects {
    buildscript {
        repositories { applyMirrors(delegate) }
    }
    repositories { applyMirrors(delegate) }
}

// 作用于 settings 级别（包括 pluginManagement 和 dependencyResolutionManagement）
settingsEvaluated { settings ->
    settings.pluginManagement.repositories { applyMirrors(delegate) }
    try {
        settings.dependencyResolutionManagement.repositories { applyMirrors(delegate) }
    } catch (Exception ignored) {
    }
}
